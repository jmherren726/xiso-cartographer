# CI: formatting, static analysis, host build + unit tests (Linux, Windows), the XBE
# build, the synthetic test fixtures, and a short fuzzing run.
# The job names are referenced by the "Protect main" ruleset as required checks;
# renaming a job means updating the ruleset too (see CONTRIBUTING.md).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Keep in step with the version contributors use locally (CONTRIBUTING.md).
  CLANG_FORMAT_VERSION: "23.1.3"
  CLANG_TIDY_VERSION: "22.1.8"

jobs:
  format:
    name: format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install clang-format
        run: pipx install "clang-format==${CLANG_FORMAT_VERSION}"
      - name: Check formatting
        run: |
          clang-format --version
          git ls-files -z '*.c' '*.h' | xargs -0 --no-run-if-empty clang-format --dry-run --Werror

  tidy:
    name: clang-tidy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build
          pipx install "clang-tidy==${CLANG_TIDY_VERSION}"
      - name: Configure (compile database)
        run: CC=clang cmake --preset host-debug
      - name: Run clang-tidy
        run: |
          clang-tidy --version
          # Host-built code only; app/ needs nxdk headers and isn't in the host compile database.
          git ls-files -z 'core/*.c' 'platform/host/*.c' 'tools/xcat-cli/*.c' |
            xargs -0 --no-run-if-empty clang-tidy -p build/host-debug --quiet

  linux:
    name: linux (${{ matrix.cc }}, ${{ matrix.preset }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
        preset: [host-debug, host-release]
    env:
      CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build
      - name: Configure
        # Release jobs also test the >4 GiB sparse fixture (64-bit offsets).
        run: cmake --preset ${{ matrix.preset }} ${{ matrix.preset == 'host-release' && '-DXCAT_LARGE_FIXTURES=ON' || '' }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  windows:
    name: windows (${{ matrix.cc }}, ${{ matrix.preset }})
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        cc: [cl, clang-cl]
        preset: [host-debug, host-release]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      # vcvars64 provides cl, the Windows SDK, and VS's bundled CMake and Ninja.
      # Each step gets a fresh shell, so configure, build and test run in one.
      - name: Configure, build and test
        shell: cmd
        env:
          CC: ${{ matrix.cc }}
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSINSTALL=%%i"
          call "%VSINSTALL%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          where %CC% cmake ninja
          cmake --preset ${{ matrix.preset }} || exit /b 1
          cmake --build --preset ${{ matrix.preset }} || exit /b 1
          ctest --preset ${{ matrix.preset }} || exit /b 1

  xbe:
    name: xbe
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - name: Build nxdk image and XBE
        run: make docker-xbe
      - name: Check output
        run: |
          ls -l app/bin/default.xbe app/xiso-cartographer.iso
          ls -l app/fatx-probe/bin/default.xbe app/fatx-probe/xcat-fatx-probe.iso
          ls -l app/net-test/bin/default.xbe app/net-test/xcat-net-test.iso
          # Every XBE starts with the "XBEH" magic.
          test "$(head -c 4 app/bin/default.xbe)" = "XBEH"
          test "$(head -c 4 app/fatx-probe/bin/default.xbe)" = "XBEH"
          test "$(head -c 4 app/net-test/bin/default.xbe)" = "XBEH"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: xiso-cartographer-xbe-${{ github.sha }}
          path: |
            app/bin/default.xbe
            app/xiso-cartographer.iso
            app/fatx-probe/bin/default.xbe
            app/fatx-probe/xcat-fatx-probe.iso
            app/net-test/bin/default.xbe
            app/net-test/xcat-net-test.iso
          if-no-files-found: error
          retention-days: 30

  fixtures:
    name: fixtures
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - name: Generator unit tests
        run: python3 -I -m unittest discover -s tools/fixtures -p 'test_*.py' -v
      - name: Generate fixtures and cross-check with extract-xiso
        # Includes the >4 GiB sparse image; extracting it writes ~4 GiB, freed per fixture.
        run: make fixtures-verify FIXTURES_DIR=build/fixtures FIXTURES_ARGS=--large
      - name: Check determinism
        # Manifests carry every file's sector, size and SHA-256, so equal manifests plus
        # equal small images mean equal output without re-reading GBs of sparse holes.
        run: |
          python3 tools/fixtures/fixtures.py --out build/fixtures-again --large
          for f in build/fixtures/*.json build/fixtures/small.iso build/fixtures/deep.iso; do
            cmp "$f" "build/fixtures-again/$(basename "$f")"
          done

  fuzz:
    name: fuzz
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build libclang-rt-18-dev
      - name: Build fuzz targets (clang, libFuzzer + ASan + UBSan)
        run: cmake --preset fuzz && cmake --build --preset fuzz
      - name: Replay seeds and run tests
        run: ctest --preset fuzz
      - name: Fuzz the XDVDFS reader (60 s)
        run: |
          mkdir -p build/fuzz/corpus build/fuzz/artifacts
          ./build/fuzz/core/tests/fuzz_xdvdfs -max_total_time=60 -max_len=65536 \
            -print_final_stats=1 -artifact_prefix=build/fuzz/artifacts/ \
            build/fuzz/corpus build/fuzz/fuzz-seeds
      - name: Fuzz the HTTP response, chunked and URL parsers (60 s)
        run: |
          mkdir -p build/fuzz/corpus-http build/fuzz/artifacts
          ./build/fuzz/core/tests/fuzz_http -max_total_time=60 -max_len=65536 \
            -print_final_stats=1 -artifact_prefix=build/fuzz/artifacts/ \
            build/fuzz/corpus-http core/tests/fuzz-seeds/http
      - name: Fuzz the credentials file parser (60 s)
        run: |
          mkdir -p build/fuzz/corpus-credentials build/fuzz/artifacts
          ./build/fuzz/core/tests/fuzz_credentials -max_total_time=60 -max_len=65536 \
            -print_final_stats=1 -artifact_prefix=build/fuzz/artifacts/ \
            build/fuzz/corpus-credentials core/tests/fuzz-seeds/credentials
      - name: Fuzz the map loader (60 s)
        run: |
          mkdir -p build/fuzz/corpus-map build/fuzz/artifacts
          ./build/fuzz/core/tests/fuzz_map -max_total_time=60 -max_len=65536 \
            -print_final_stats=1 -artifact_prefix=build/fuzz/artifacts/ \
            build/fuzz/corpus-map core/tests/fuzz-seeds/map
      - name: Fuzz the install journal reader (60 s)
        run: |
          mkdir -p build/fuzz/corpus-journal build/fuzz/artifacts
          ./build/fuzz/core/tests/fuzz_journal -max_total_time=60 -max_len=65536 \
            -print_final_stats=1 -artifact_prefix=build/fuzz/artifacts/ \
            build/fuzz/corpus-journal core/tests/fuzz-seeds/journal
      - name: Fuzz the trust-anchor (PEM bundle) loader (60 s)
        run: |
          mkdir -p build/fuzz/corpus-tls build/fuzz/artifacts
          ./build/fuzz/core/tests/fuzz_tls_anchors -max_total_time=60 -max_len=65536 \
            -print_final_stats=1 -artifact_prefix=build/fuzz/artifacts/ \
            build/fuzz/corpus-tls core/tests/fuzz-seeds/tls
      - name: Fuzz the SNTP answer checks (60 s)
        run: |
          mkdir -p build/fuzz/corpus-sntp build/fuzz/artifacts
          ./build/fuzz/core/tests/fuzz_sntp -max_total_time=60 -max_len=4096 \
            -print_final_stats=1 -artifact_prefix=build/fuzz/artifacts/ \
            build/fuzz/corpus-sntp core/tests/fuzz-seeds/sntp
      - name: Fuzz the zip directory reader (60 s)
        run: |
          mkdir -p build/fuzz/corpus-zip build/fuzz/artifacts
          ./build/fuzz/core/tests/fuzz_zip -max_total_time=60 -max_len=8192 \
            -print_final_stats=1 -artifact_prefix=build/fuzz/artifacts/ \
            build/fuzz/corpus-zip core/tests/fuzz-seeds/zip
      - name: Fuzz reading Deflate members with checkpoints (60 s)
        run: |
          mkdir -p build/fuzz/corpus-zip-inflate build/fuzz/artifacts
          ./build/fuzz/core/tests/fuzz_zip_inflate -max_total_time=60 -max_len=65536 \
            -print_final_stats=1 -artifact_prefix=build/fuzz/artifacts/ \
            build/fuzz/corpus-zip-inflate core/tests/fuzz-seeds/zip-inflate
      - name: Fuzz archive.org item listings (60 s)
        run: |
          mkdir -p build/fuzz/corpus-archiveorg build/fuzz/artifacts
          ./build/fuzz/core/tests/fuzz_archiveorg -max_total_time=60 -max_len=65536 \
            -print_final_stats=1 -artifact_prefix=build/fuzz/artifacts/ \
            build/fuzz/corpus-archiveorg core/tests/fuzz-seeds/archiveorg
      - name: Fuzz XBE certificates (60 s)
        run: |
          mkdir -p build/fuzz/corpus-xbe build/fuzz/artifacts
          ./build/fuzz/core/tests/fuzz_xbe -max_total_time=60 -max_len=8192 \
            -print_final_stats=1 -artifact_prefix=build/fuzz/artifacts/ \
            build/fuzz/corpus-xbe core/tests/fuzz-seeds/xbe
      - name: Fuzz sequential extraction (60 s)
        run: |
          mkdir -p build/fuzz/corpus-seq build/fuzz/artifacts
          ./build/fuzz/core/tests/fuzz_seq -max_total_time=60 -max_len=1100000 \
            -print_final_stats=1 -artifact_prefix=build/fuzz/artifacts/ \
            build/fuzz/corpus-seq build/fuzz/fuzz-seeds-seq
      - name: Upload crashing inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts-${{ github.sha }}
          path: build/fuzz/artifacts/
          if-no-files-found: ignore
