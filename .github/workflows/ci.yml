# Host CI: formatting, static analysis, and build + unit tests on Linux and Windows.
# The job names are referenced by the "Protect main" ruleset as required checks;
# renaming a job means updating the ruleset too (see CONTRIBUTING.md).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Keep in step with the version contributors use locally (CONTRIBUTING.md).
  CLANG_FORMAT_VERSION: "23.1.3"
  CLANG_TIDY_VERSION: "22.1.8"

jobs:
  format:
    name: format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install clang-format
        run: pipx install "clang-format==${CLANG_FORMAT_VERSION}"
      - name: Check formatting
        run: |
          clang-format --version
          git ls-files -z '*.c' '*.h' | xargs -0 --no-run-if-empty clang-format --dry-run --Werror

  tidy:
    name: clang-tidy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build
          pipx install "clang-tidy==${CLANG_TIDY_VERSION}"
      - name: Configure (compile database)
        run: CC=clang cmake --preset host-debug
      - name: Run clang-tidy
        run: |
          clang-tidy --version
          git ls-files -z '*.c' | xargs -0 --no-run-if-empty clang-tidy -p build/host-debug --quiet

  linux:
    name: linux (${{ matrix.cc }}, ${{ matrix.preset }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
        preset: [host-debug, host-release]
    env:
      CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  windows:
    name: windows (${{ matrix.cc }}, ${{ matrix.preset }})
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        cc: [cl, clang-cl]
        preset: [host-debug, host-release]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      # vcvars64 provides cl, the Windows SDK, and VS's bundled CMake and Ninja.
      # Each step gets a fresh shell, so configure, build and test run in one.
      - name: Configure, build and test
        shell: cmd
        env:
          CC: ${{ matrix.cc }}
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSINSTALL=%%i"
          call "%VSINSTALL%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          where %CC% cmake ninja
          cmake --preset ${{ matrix.preset }} || exit /b 1
          cmake --build --preset ${{ matrix.preset }} || exit /b 1
          ctest --preset ${{ matrix.preset }} || exit /b 1
